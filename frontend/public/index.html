<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">

    <!-- Header -->
    <h1>Diary Chatbot</h1>

    <!-- Diary input section -->
    <div id="setup-section">
      <label for="date">Date (DD/MM/YYYY):</label>
      <input type="text" id="date" placeholder="e.g. 10/11/2025">

      <label for="diary-entry">Your Diary Entry:</label>
      <textarea id="diary-entry" rows="5" placeholder="Write about your day..."></textarea>

      <button id="analyze-btn">Analyze Diary</button>
    </div>

    <!-- Chat section -->
    <div id="chat-section" class="hidden">
      <div id="chat-box"></div>

      <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
